<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        main{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        div#conteiner{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 100px);
            width: 500px;
            border: 1px solid black;
        }

        .c1{
            grid-row: 1/2;
            grid-column: 1/5;
            background-color: green;
        }
        
        .c2{
            grid-row: 2/3;
            grid-column: 1/3;
            background-color: red;
        }
        .c3{
            grid-row: 2/5;
            grid-column: 3/5;
            background-color: yellow;
        }
        .c4{
            
            grid-row: 3/5;
            grid-column: 1/3;
            background-color: aqua;
        }

    </style>
</head>
<body>
    <main>
            <div id="conteiner">
    
                <div class="c1">caixa 1</div>
                <div class="c2">caixa 2</div>
                <div class="c3">caixa 3</div>
                <div class="c4">caixa 4</div>

            </div>
</main>
</body>
</html>
